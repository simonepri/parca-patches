# Checks every change: the patches apply to the pinned upstreams, the patched unit tests pass, and the Parca and parcagpu images build.
name: CI

on:
  push:
    branches: [ main, release-please--branches--main ]
  pull_request:
    branches: [ main, release-please--branches--main ]

permissions:
  contents: read

jobs:
  validate-patches:
    name: Validate Upstream Patch Rebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Apply All Patches
        run: mise run patch

  parca-unit-tests:
    name: Parca Unit Tests
    needs: [validate-patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Run Patched Parca Unit Tests
        run: mise run test:parca

  parca-image:
    name: Parca Image Build
    needs: [validate-patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Build the Patched Parca Image
        run: mise run build:parca
      - name: Check the Image Serves the UI
        run: |
          tag="$(mise env --json | jq -r .PARCA_IMAGE_TAG)"
          docker run --detach --name parca --publish 7070:7070 "local/parca:$tag" /parca --config-path=/parca.yaml
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:7070/ | grep -q '<div id="root"'; then
              echo "Parca serves the UI"
              exit 0
            fi
            sleep 2
          done
          docker logs parca
          echo "::error::Parca did not serve the UI within 60 seconds"
          exit 1

  parcagpu-unit-tests:
    name: parcagpu Unit Tests
    needs: [validate-patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Run Patched parcagpu Unit Tests
        run: mise run test:parcagpu

  parcagpu-image:
    name: parcagpu Image Build
    needs: [validate-patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Build the Patched parcagpu Image
        run: mise run build:parcagpu
      - name: Check the Image Layout and Patched Library
        run: |
          tag="$(mise env --json | jq -r .PARCAGPU_IMAGE_TAG)"
          docker run --rm "local/parcagpu:$tag" sh -c '
            ls -l /usr/lib
            for f in libparcagpucupti.so libcupti.so.12 libcupti.so.13 libnvperf_host.so.12 libnvperf_host.so.13; do
              test -s "/usr/lib/$f" || { echo "::error::/usr/lib/$f is missing"; exit 1; }
            done
            grep -q RmProfilingAdminOnly /usr/lib/libparcagpucupti.so || { echo "::error::libparcagpucupti.so lacks the profiling access check"; exit 1; }
            echo "parcagpu image has the expected layout"
          '
