# Pins the upstream Parca release and parcagpu commit, their patch versions, and the tools that patch, test, build, and publish the patched images.

[tools]
go = "1.26.8"
node = "22.22.2"
pnpm = "11.5.2"
jq = "1.8.2"

[env]
# renovate: datasource=github-releases depName=parca-dev/parca
PARCA_UPSTREAM = "v0.30.0"
PARCA_PATCH_VERSION = "0.2.1"
PARCA_IMAGE = "ghcr.io/simonepri/parca"
PARCA_IMAGE_TAG = "{{env.PARCA_UPSTREAM}}-p{{env.PARCA_PATCH_VERSION}}"
# renovate: datasource=git-refs depName=parca-dev/parcagpu branch=main
PARCAGPU_UPSTREAM = "ba7a41959637126653749335703db1b865008eae"
PARCAGPU_PATCH_VERSION = "0.1.0"
PARCAGPU_IMAGE = "ghcr.io/simonepri/parcagpu"
PARCAGPU_IMAGE_TAG = "{{env.PARCAGPU_UPSTREAM | truncate(length=7, end='')}}-p{{env.PARCAGPU_PATCH_VERSION}}"

[tasks."patch:parca"]
description = "Apply patches to third_party/parca"
run = "build/parca/patch.sh"

[tasks."patch:parcagpu"]
description = "Apply patches to third_party/parcagpu"
run = "build/parcagpu/patch.sh"

[tasks.patch]
description = "Apply all patches to third_party upstreams"
depends = ["patch:parca", "patch:parcagpu"]

[tasks."build:parca"]
description = "Build the patched Parca image for the local platform"
depends = ["patch:parca"]
run = "build/parca/build.sh"

[tasks."build:parcagpu"]
description = "Build the patched parcagpu image for the local platform"
depends = ["patch:parcagpu"]
run = "build/parcagpu/build.sh"

[tasks.build]
description = "Build all patched images"
depends = ["build:parca", "build:parcagpu"]

[tasks."publish:parca"]
description = "Build and publish the patched multi-arch Parca image to GHCR"
depends = ["patch:parca"]
run = "build/parca/publish.sh"

[tasks."publish:parcagpu"]
description = "Build and publish the patched multi-arch parcagpu image to GHCR"
depends = ["patch:parcagpu"]
run = "build/parcagpu/publish.sh"

[tasks.publish]
description = "Publish all patched images"
depends = ["publish:parca", "publish:parcagpu"]

[tasks."test:parca"]
description = "Run the patched Parca unit tests for the packages the patches touch"
dir = "third_party/parca"
depends = ["patch:parca"]
run = "go test -race ./pkg/clickhouse/... ./pkg/parcacol/... ./pkg/query/..."

[tasks."test:parcagpu"]
description = "Run the patched parcagpu unit tests that need no GPU (needs Docker)"
depends = ["patch:parcagpu"]
run = "build/parcagpu/test.sh"

[tasks.test]
description = "Run all patched unit tests"
depends = ["test:parca", "test:parcagpu"]
